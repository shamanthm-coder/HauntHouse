<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>HauntHouse — Escape the Ghost</title>
    <meta name="description" content="Find the items. Outsmart the ghost. Escape before midnight.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/game.css">
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="reticle" class="hidden"></div>
    <div id="hud" class="hidden">
      <header>
        <p class="brand">HauntHouse</p>
        <h1 id="room">Foyer</h1>
        <p id="clock">11:05 PM</p>
      </header>
      <p id="objective"></p>
      <div class="lower">
        <p id="hint"></p>
        <p id="log"></p>
        <p id="prompt"></p>
        <div class="meta">
          <p id="items"></p>
          <p id="meter" class="meter">CALM</p>
          <div class="track"><i id="bar"></i></div>
        </div>
        <p id="controls" class="control-hints"></p>
        <p id="debug"></p>
      </div>
    </div>
    <div id="overlay">
      <div id="panel"></div>
    </div>
    <noscript>HauntHouse needs JavaScript.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
